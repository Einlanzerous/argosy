root = "."
tmp_dir = "tmp"

[build]
  # -buildvcs=false: the source is bind-mounted (host-owned), so in-container
  # VCS stamping fails on "dubious ownership". Prod builds (deploy/Dockerfile)
  # exclude .git and are unaffected.
  cmd = "go build -buildvcs=false -o ./tmp/argosy ./cmd/argosy"
  bin = "./tmp/argosy"
  # Watch the built SPA as well as Go sources. The web bundle reaches the server
  # through go:embed, so it is baked in at link time — a `make web-build` alone
  # changes nothing on :8097 until the binary is rebuilt. Without this the dev
  # server keeps serving whichever bundle was built last, silently, however old
  # it is (it was a week stale once, and cost a round of "the fix doesn't work").
  # `web` stays excluded so the source tree and node_modules aren't scanned;
  # these extensions only match internal/webui/dist in practice.
  include_ext = ["go", "html", "js", "css"]
  exclude_dir = ["tmp", "bin", "web", "assets", "deploy", ".git", ".github", "mobile", "graphify-out", "node_modules"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
