openapi: 3.0.3
info:
  title: Argosy API
  version: 0.1.0
  description: |
    Self-hosted media streaming server. This spec is the single source of truth
    for the HTTP contract; the Go server interface and the TypeScript client are
    generated from it (`make generate`), and CI fails on drift.

servers:
  - url: /

tags:
  - name: system
  - name: auth

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Readiness probe and build identity
      description: >-
        Returns 200 when the database is reachable and 503 when it is not.
        The body shape is IDENTICAL on both paths: a degraded service is still
        running a version, and it is the one most worth identifying, so
        `version` and `sha` must be readable from the 503 branch too.
        `version` is bare semver or the literal `dev`; `sha` is null when the
        build supplied none. Neither is ever inferred.
      security: []
      responses:
        "200":
          description: The database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: >-
            A dependency (the database) is unavailable. Identical body shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/ping:
    get:
      tags: [system]
      operationId: ping
      summary: Service identity and version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

  /api/v1/scan:
    post:
      tags: [library]
      operationId: triggerScan
      summary: Trigger an immediate library re-scan ("rebuild the Manifest")
      responses:
        "202":
          description: A scan sweep was queued
        "409":
          description: A scan sweep is already running or queued
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/scan/status:
    get:
      tags: [library]
      operationId: getScanStatus
      summary: Current/last scan sweep status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate an account and list its profiles
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; returns the account and its profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/devices:
    post:
      tags: [auth]
      operationId: registerDevice
      summary: Register a device for a profile and issue a device token
      description: |
        Re-authenticates with account credentials and binds a new device to the
        chosen profile, returning a bearer token used for all subsequent calls.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationRequest"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistrationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [auth]
      operationId: listDevices
      summary: List devices in the current account (the Fleet)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/devices/switch:
    post:
      tags: [auth]
      operationId: switchDeviceProfile
      summary: Re-bind the calling device to another profile (in-place switch)
      description: >
        Re-points the calling device to a different profile in the same account
        without re-pairing — the device token is unchanged. Switching INTO an
        admin profile requires the account password so a viewer device can't
        silently assume admin. Returns the refreshed session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSwitchRequest"
      responses:
        "200":
          description: Switched; the session reflects the new profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/devices/{deviceId}:
    delete:
      tags: [auth]
      operationId: revokeDevice
      summary: Revoke a device token ("retire from the Fleet")
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Device revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [auth]
      operationId: renameDevice
      summary: Rename a device in the Fleet
      description: >
        Give a device a friendly label. Admins may rename any device in the
        account; a viewer may rename only their own.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRenameRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/profiles:
    get:
      tags: [auth]
      operationId: listProfiles
      summary: List the current account's profiles
      description: >
        Returns every profile in the caller's account with its role and how many
        active devices are bound to it. Any signed-in profile may list; creating,
        editing, and deleting profiles is admin-only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      operationId: createProfile
      summary: Create a profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreateRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/profiles/{userId}:
    patch:
      tags: [auth]
      operationId: updateProfile
      summary: Rename a profile or change its role (admin only)
      description: >
        Omit a field to leave it unchanged. Demoting the only remaining admin to
        viewer is rejected so an account can never lock itself out.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [auth]
      operationId: deleteProfile
      summary: Delete a profile (admin only)
      description: >
        Devices bound to the deleted profile are unbound — they keep working but
        drop to viewer access until reassigned. The account must keep at least
        one admin, and you can't delete the profile you're currently signed in as.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Profile deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/link/start:
    post:
      tags: [auth]
      operationId: startLink
      summary: Begin code-pairing — mint a short code for the new device to display
      description: |
        A new device (TV or phone, which shouldn't have to type credentials)
        calls this to get a short pairing code. It displays the code, then polls
        `GET /auth/link/{code}` until an authenticated user approves it and a
        device token is handed back. The optional body lets the device announce
        what it is, so the approver sees "Pixel 9 (android)" instead of a bare
        code and the created Fleet device is named/typed correctly.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkStartRequest"
      responses:
        "201":
          description: Pairing code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStartResponse"

  /api/v1/auth/link/{code}:
    get:
      tags: [auth]
      operationId: getLinkStatus
      summary: Poll a pairing code; returns the device token once approved
      description: |
        The new device polls this. While pending, `status` is `pending`. Once
        approved, it returns `status: approved` plus the one-time device
        `token`, and the code is consumed (single use). While pending it also
        echoes the device-announced `deviceName`/`platform` so an approving UI
        can show what is about to be linked.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current status (the token is present once approved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/link/{code}/approve:
    post:
      tags: [auth]
      operationId: approveLink
      summary: Approve a pairing code from a signed-in session
      description: >
        Called from an authenticated session (web or mobile). Links the new
        device to the caller's account and profile by creating a device; the
        new device claims its token on the next poll.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkApproveRequest"
      responses:
        "204":
          description: Approved; the TV will claim its token on its next poll
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The code was already approved

  /api/v1/preferences:
    get:
      tags: [auth]
      operationId: getDevicePreferences
      summary: Get the calling device's playback preferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [auth]
      operationId: setDevicePreferences
      summary: Update the calling device's playback preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePreferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/user/preferences:
    get:
      tags: [auth]
      operationId: getUserPreferences
      summary: Get the calling profile's account-wide preferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [auth]
      operationId: setUserPreferences
      summary: Update the calling profile's account-wide preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferences"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentSession
      summary: Resolve the current (account, profile, device) from the token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the account password (self-serve)
      description: >
        Verifies the current account password and replaces it with a new one.
        Device tokens are independent of the password, so existing devices stay
        signed in. A wrong current password answers 403 (never 401 — it must
        not look like an expired token and sign the device out).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/accounts:
    get:
      tags: [auth]
      operationId: listAccounts
      summary: List every account on this instance (owner only)
      description: >
        Account lifecycle surface (ARGY-86). Listing and managing *accounts* is
        an instance-level power — accounts are the server's households, not
        anything inside the caller's own — so it is gated on instance ownership
        (ARGY-167), not household admin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/accounts/{accountId}:
    patch:
      tags: [auth]
      operationId: updateAccount
      summary: Disable or re-enable an account (owner only)
      description: >
        A disabled account keeps all its data but can no longer sign in, and
        its paired devices stop authenticating immediately. The instance
        owner's account can't be disabled — that would brick the server.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [auth]
      operationId: deleteAccount
      summary: Delete an account and everything it owns (owner only)
      description: >
        Removes the account with its profiles, devices, watch history, vaults
        and preferences (DB cascade). The instance owner's account can't be
        deleted, and neither can an account that still owns media libraries
        (possible on pre-ARGY-167 data) — the cascade would take catalog items
        with it, so such rows must be moved first. Prefer disabling unless the
        person is truly gone — deletion is unrecoverable.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/accounts/{accountId}/password-reset:
    post:
      tags: [auth]
      operationId: resetAccountPassword
      summary: Reset an account's password to a fresh generated one (owner only)
      description: >
        Server-generates a new password and returns it exactly once — the same
        contract as provisioning (only the bcrypt hash is stored). There is no
        way to *choose* a password for someone else. The account's paired
        devices are revoked as part of the reset: unlike the self-serve
        change-password flow (which proves the current password, so existing
        devices are known-good), an owner reset means the credential was lost
        or leaked, and a leaked password may already have paired a device. The
        owner account itself is refused: rotate your own password through the
        self-serve flow instead.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/accounts:
    post:
      tags: [auth]
      operationId: createAccount
      summary: Create an account (service-to-service provisioning)
      description: >
        Creates a new account with one initial admin profile named after the
        account. This is the Purser provisioning surface (ARGY-132): it is
        authorized by the static X-Provision-Token header rather than a bearer
        session, because a session is always scoped to an *existing* account.
        When `password` is omitted the server generates one and returns it
        exactly once as `generatedPassword` — only the bcrypt hash is stored.
        The route is registered only when ARGOSY_PROVISION_TOKEN is set, so an
        unconfigured server answers 404.
      security:
        - provisionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            An account with that email already exists. The body carries the
            existing account so the caller can record its real id (ARGY-163).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConflictError"
    get:
      tags: [auth]
      operationId: lookupAccount
      summary: Look up an account by email (service-to-service provisioning)
      description: >
        Read-only companion to createAccount (ARGY-163): answers whether an
        account exists for the given email without creating or changing
        anything, so a reconcile pass can run record-only. Gated on the same
        X-Provision-Token, and registered only when ARGOSY_PROVISION_TOKEN is
        set.
      security:
        - provisionToken: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: The account email. Matched case-insensitively.
      responses:
        "200":
          description: The account owning that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLookupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [auth]
      operationId: deprovisionAccount
      summary: Delete an account by email (service-to-service deprovisioning)
      description: >
        The teardown companion to createAccount (ARGY-86): lets the
        provisioning service remove the account it created when a member is
        offboarded, taking profiles, devices, history and preferences with it
        (DB cascade). The instance owner's account is refused with 409. Gated
        on the same X-Provision-Token, and registered only when
        ARGOSY_PROVISION_TOKEN is set. Prefer the id-keyed pair under
        /api/v1/admin/accounts/{accountId} (ARGY-187): a caller that recorded
        the account id at creation shouldn't have to re-resolve it from an
        email the member may since have changed, and revoking beats deleting.
      security:
        - provisionToken: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: The account email. Matched case-insensitively.
      responses:
        "204":
          description: Account deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/accounts/{accountId}:
    patch:
      tags: [auth]
      operationId: revokeProvisionedAccount
      summary: Disable or restore an account (service-to-service revoke)
      description: >
        The revoke Purser's `offboard` maps to (ARGY-187), keyed by the account
        id it recorded at creation rather than by email. `disabled: true` takes
        access away without destroying anything: sign-in is refused and every
        paired device stops authenticating immediately, because device
        authentication joins on the account being enabled — the device rows are
        left intact, so `disabled: false` restores the Fleet rather than making
        the member re-pair. That reversibility is why this, not delete, is the
        primitive an offboard should use; Argosy owns real user state (profiles,
        watch history, device pairings) that a mistaken offboard shouldn't burn.
        Idempotent: re-disabling an already-disabled account leaves the original
        timestamp. The instance owner's account is refused with 409. Gated on
        the same X-Provision-Token, and registered only when
        ARGOSY_PROVISION_TOKEN is set.
      security:
        - provisionToken: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: The account in its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [auth]
      operationId: deleteProvisionedAccount
      summary: Delete an account by id (service-to-service purge)
      description: >
        The destructive counterpart to revokeProvisionedAccount (ARGY-187):
        removes the account and everything cascading from it — profiles,
        devices, watch history, vaults, preferences. Reserve it for an explicit
        purge; an offboard that only needs to take access away should PATCH
        `disabled: true` instead. Keyed by account id, which is what Purser
        records at creation (ARGY-163); the email-keyed deprovisionAccount is
        the older equivalent. Effectively idempotent — a repeat call answers
        404, which the caller reads as "nothing left to revoke". An account
        that still owns libraries is refused with 409, as is the instance
        owner's. Gated on the same X-Provision-Token, and registered only when
        ARGOSY_PROVISION_TOKEN is set.
      security:
        - provisionToken: []
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Account deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/libraries:
    get:
      tags: [library]
      operationId: listLibraries
      summary: List the account's libraries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [library]
      operationId: createLibrary
      summary: Register a new media library (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLibraryRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400":
          description: Invalid path (not an existing directory) or missing fields
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin only

  /api/v1/libraries/{libraryId}:
    delete:
      tags: [library]
      operationId: deleteLibrary
      summary: Remove a library and its items (admin only)
      parameters:
        - { name: libraryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Admin only
        "404":
          description: Not found

  /api/v1/libraries/{libraryId}/movies:
    get:
      tags: [library]
      operationId: listMovies
      summary: Browse movies in a library
      parameters:
        - { name: libraryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [title, added, year, rating], default: title } }
        - { name: genre, in: query, description: "Filter to items in any of these genres (repeatable).", style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: rating_min, in: query, description: "Minimum effective rating (0–10).", schema: { type: number, minimum: 0, maximum: 10 } }
        - { name: watched, in: query, description: "Per-user watched state.", schema: { type: string, enum: [watched, unwatched, in_progress] } }
        - { name: year_from, in: query, description: "Earliest release year (inclusive).", schema: { type: integer } }
        - { name: year_to, in: query, description: "Latest release year (inclusive).", schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/libraries/{libraryId}/series:
    get:
      tags: [library]
      operationId: listSeries
      summary: Browse series in a library
      parameters:
        - { name: libraryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [title, year, rating], default: title } }
        - { name: genre, in: query, description: "Filter to series in any of these genres (repeatable).", style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: rating_min, in: query, description: "Minimum effective rating (0–10).", schema: { type: number, minimum: 0, maximum: 10 } }
        - { name: watched, in: query, description: "Per-user watched state (aggregated over episodes).", schema: { type: string, enum: [watched, unwatched, in_progress] } }
        - { name: year_from, in: query, description: "Earliest release year (inclusive).", schema: { type: integer } }
        - { name: year_to, in: query, description: "Latest release year (inclusive).", schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/search:
    get:
      tags: [library]
      operationId: search
      summary: Full-text search across the account's films and series
      description: >-
        Ranked full-text search over titles, genres, cast/crew, and
        overviews, scoped to the calling account's libraries. Results are grouped
        by kind (films vs. series). The query supports typeahead — the last token
        of each word is treated as a prefix.
      parameters:
        - { name: q, in: query, required: true, description: "Search text (prefix-matched per token).", schema: { type: string } }
        - { name: limit, in: query, description: "Max results per group.", schema: { type: integer, default: 8, minimum: 1, maximum: 25 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/facets:
    get:
      tags: [library]
      operationId: listFacets
      summary: Most common genres across the account's manifest
      description: >-
        The most-used genres across the account's films and series, ranked by
        item count — used to surface discovery chips.
      parameters:
        - { name: limit, in: query, description: "Max facets to return.", schema: { type: integer, default: 8, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Facet" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/vaults:
    get:
      tags: [library]
      operationId: listVaults
      summary: List vaults visible to the current profile (own + shared)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Vault" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [library]
      operationId: createVault
      summary: Create a vault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVaultRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/vaults/{vaultId}:
    get:
      tags: [library]
      operationId: getVault
      summary: Vault detail with its items
      parameters:
        - { name: vaultId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found or not visible
    patch:
      tags: [library]
      operationId: updateVault
      summary: Rename / re-describe / toggle sharing (owner or admin)
      parameters:
        - { name: vaultId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVaultRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not permitted
        "404":
          description: Not found
    delete:
      tags: [library]
      operationId: deleteVault
      summary: Delete a vault (owner or admin)
      parameters:
        - { name: vaultId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not permitted
        "404":
          description: Not found

  /api/v1/vaults/{vaultId}/items:
    post:
      tags: [library]
      operationId: addVaultItem
      summary: Add a film or series to a vault
      parameters:
        - { name: vaultId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddVaultItemRequest" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not permitted
        "404":
          description: Vault not found

  /api/v1/vaults/{vaultId}/items/{entryId}:
    delete:
      tags: [library]
      operationId: removeVaultItem
      summary: Remove an item from a vault
      parameters:
        - { name: vaultId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not permitted
        "404":
          description: Not found

  /api/v1/vaults/{vaultId}/order:
    put:
      tags: [library]
      operationId: reorderVault
      summary: Reorder a vault's items
      parameters:
        - { name: vaultId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderVaultRequest" }
      responses:
        "204":
          description: Reordered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not permitted
        "404":
          description: Not found

  /api/v1/series/{seriesId}:
    get:
      tags: [library]
      operationId: getSeries
      summary: Series detail with seasons and episodes
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}:
    get:
      tags: [library]
      operationId: getMediaItem
      summary: Media item detail with effective metadata
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/stream:
    get:
      tags: [library]
      operationId: streamItem
      summary: Direct-play media stream with HTTP range support
      description: |
        Streams the item's media file with byte-range support (seeking). Auth is
        the per-device token via the bearer header OR a `token` query param,
        since an HTML5 `<video>` element cannot set Authorization.
      security: []
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: query, description: "Per-device token (alternative to the bearer header).", schema: { type: string } }
      responses:
        "200":
          description: Full media content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial content (range request)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/subtitles:
    get:
      tags: [library]
      operationId: listSubtitles
      summary: Available subtitle tracks for an item
      description: |
        Lists subtitle tracks resolved through the priority chain: embedded text
        tracks (from the container) plus OpenSubtitles candidates when configured.
        Each track's `id` is fetched as WebVTT from the sibling endpoint.

        Image-based tracks (PGS/VOBSUB/DVB) are listed last and flagged with
        `burnIn`. They have no WebVTT form — the sibling endpoint refuses their
        ids — and are shown by burning them into the video during a transcode
        (ARGY-59). They never count as language coverage, so an OpenSubtitles
        text candidate is still offered for a language that only has an image
        track.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubtitleTrack"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/subtitles/{trackId}:
    get:
      tags: [library]
      operationId: getSubtitle
      summary: A subtitle track as WebVTT
      description: |
        Produces (and disk-caches) the track as WebVTT. Auth is the per-device
        token via the bearer header OR a `token` query param, since an HTML5
        `<track>` element cannot set Authorization.
      security: []
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: trackId, in: path, required: true, description: "Track id from the list endpoint (e.g. `embedded:3`, `os:12345`).", schema: { type: string } }
        - { name: token, in: query, description: "Per-device token (alternative to the bearer header).", schema: { type: string } }
      responses:
        "200":
          description: WebVTT subtitle
          content:
            text/vtt:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Subtitle could not be produced (e.g. external fetch failed)

  /api/v1/items/{itemId}/playback:
    get:
      tags: [library]
      operationId: getPlaybackInfo
      summary: Direct-play capability decision for the item
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/next-episode:
    get:
      tags: [library]
      operationId: getNextEpisode
      summary: The next episode after this one in its series
      description: |
        Given a series episode, returns the next playable episode in season/
        episode order — rolling across season boundaries to the next season's
        first episode. Returns 404 when the item is the last episode of the
        series, has no following playable episode, or isn't a series episode at
        all (e.g. a film). Powers the player's auto-advance "Up Next" overlay.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnDeckItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/progress:
    get:
      tags: [library]
      operationId: getProgress
      summary: Current play-state (resume position) for the item
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [library]
      operationId: reportProgress
      summary: Heartbeat — upsert the resume position for the current profile
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: Updated play-state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{itemId}/watched:
    post:
      tags: [library]
      operationId: setWatched
      summary: Mark an item watched / unwatched for the current profile
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchedUpdate"
      responses:
        "200":
          description: Updated play-state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/series/{seriesId}/watched:
    post:
      tags: [library]
      operationId: setSeriesWatched
      summary: Mark every episode of a series watched / unwatched for the current profile
      parameters:
        - { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchedUpdate"
      responses:
        "200":
          description: Number of backing files whose watched state was set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedBulkResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/seasons/{seasonId}/watched:
    post:
      tags: [library]
      operationId: setSeasonWatched
      summary: Mark every episode of a season watched / unwatched for the current profile
      parameters:
        - { name: seasonId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchedUpdate"
      responses:
        "200":
          description: Number of backing files whose watched state was set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedBulkResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/continue:
    get:
      tags: [library]
      operationId: listContinue
      summary: Continue-watching / on-deck items for the current profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ondeck:
    get:
      tags: [library]
      operationId: listOnDeck
      summary: On-deck (up-next) episodes for series the user is currently watching
      description: >
        The next unstarted episode of each series the current profile has made
        progress in — i.e. has watched at least one episode and has a later
        episode not yet started. Excludes in-progress items (those live in
        /continue), so the two rows don't overlap. Newest activity first.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnDeckItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/recent:
    get:
      tags: [library]
      operationId: listRecent
      summary: Recently-added items (films + series) across the account
      description: >
        A unified "newly arrived" feed across every library: standalone films
        and series, newest first. A series' arrival time is the most recent of
        its episodes' added-at timestamps, so adding an episode resurfaces the
        series (deduped to a single card) rather than listing each episode.
        Each item's `kind` is "movie" or "series".
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 24, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItemSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions:
    get:
      tags: [library]
      operationId: listPlaybackSessions
      summary: Live playback sessions (who's watching what, where, now)
      description: >
        Active playback sessions, most-recently-active first. Admins see the
        whole account; a viewer sees only their own. A session that owns a
        transcode session is annotated with its encoder + method (reconciled
        with The Helm).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaybackSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/beacon:
    get:
      tags: [library]
      operationId: beaconStream
      summary: SSE stream of the current user's live play-state events (Beacon)
      description: >
        Server-Sent Events stream of play_state changes for the authenticated
        user, powering cross-device resume/handoff. Authenticates via ?token=
        (an EventSource cannot set the Authorization header). Each message is
        `event: position` with a JSON data payload (see PlaybackSession-like
        fields). The client (EventSource) auto-reconnects; on reconnect it
        reconciles missed updates via a /continue or /progress fetch.
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: Per-device bearer token (EventSource can't set headers).
      responses:
        "200":
          description: An SSE event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/items/{itemId}/transcode:
    post:
      tags: [transcode]
      operationId: startTranscode
      summary: Start (or join) an HLS transcode session for an item
      description: |
        Starts a server-side transcode and returns the session plus its HLS
        playlist URL. Repeat requests for the same item + offset join the
        existing session instead of spawning a second ffmpeg. Returns 503 when
        the server is at its transcode-session limit (back-pressure).
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscodeStartRequest"
      responses:
        "202":
          description: Session started or joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: At transcode-session capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/transcode/sessions:
    get:
      tags: [transcode]
      operationId: listTranscodeSessions
      summary: Live transcode sessions for the current account (The Helm)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranscodeSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/transcode/capabilities:
    get:
      tags: [transcode]
      operationId: getTranscodeCapabilities
      summary: Encoders available on this host and the selected one
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/transcode/cache:
    get:
      tags: [transcode]
      operationId: getTranscodeCache
      summary: Transcode cache usage (Ballast)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeCacheStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/transcode/{sessionId}:
    delete:
      tags: [transcode]
      operationId: stopTranscode
      summary: Stop a transcode session and purge its output
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Stopped
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcode/{sessionId}/{file}:
    get:
      tags: [transcode]
      operationId: getTranscodeFile
      summary: HLS artifact for a session (master/variant playlist, init, or segment)
      description: |
        Serves a session's HLS artifacts: the master playlist (`index.m3u8`),
        per-variant playlists (`stream_N.m3u8`), fMP4 init segments
        (`init_N.mp4`), and media segments (`stream_N_NNNNN.m4s`). The filename
        is allow-listed server-side. `index.m3u8` returns 503 while the session
        is still starting (no playlist written yet).
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: HLS playlist or segment
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp4:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Session still starting (no playlist yet)

  /api/v1/items/{itemId}/stow:
    post:
      tags: [stow]
      operationId: stowItem
      summary: Pack an item away for offline viewing
      description: |
        Asks the server to make the item downloadable for offline playback
        (ARGY-49), and returns how that will happen.

        The decision is per item. A source the client can already play, at a size
        worth keeping on a device, is handed over untouched — the response comes
        back `method: passthrough`, `state: ready`, and a `downloadUrl` pointing
        at the existing range-capable stream endpoint. No encode runs and no
        server-side job exists.

        Otherwise the server queues a packaging job that re-encodes the source
        into a single progressive MP4 (H.264 8-bit + AAC, capped at 1080p) —
        `method: package` with an `id` to poll. Repeat requests for the same item
        join the job already running rather than starting a second encode; a job
        that previously failed is reset and retried.

        Either way the client ends up downloading exactly one file, which is what
        makes offline playback a plain local-file path rather than an offline HLS
        problem.
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StowRequest"
      responses:
        "202":
          description: Passthrough plan, or a packaging job started/joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StowJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: >
            This item needs packaging, but the server has offline packaging
            disabled (no transcoder). A passthrough stow still succeeds — only
            sources that must be re-encoded are refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/stow:
    get:
      tags: [stow]
      operationId: listStowJobs
      summary: Packaging jobs for the current account
      description: |
        Only covers items that needed packaging. A passthrough stow leaves no
        server-side state, so it never appears here — the device's own list of
        what it has stowed is the source of truth for that.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StowJob"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stow/{jobId}:
    get:
      tags: [stow]
      operationId: getStowJob
      summary: Poll a packaging job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StowJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [stow]
      operationId: deleteStowJob
      summary: Cancel a packaging job, or release a collected one
      description: |
        Serves both ends of the job's life: it cancels an encode still in flight,
        and it releases the server-side copy once the device has the bytes. Either
        way the artifact is purged. Deleting the job does not touch what the
        device already downloaded.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Cancelled and purged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stow/{jobId}/file:
    get:
      tags: [stow]
      operationId: getStowFile
      summary: Download a ready package
      description: |
        Serves the packaged MP4 with byte-range support, so an interrupted
        download resumes instead of restarting — the difference between a 2 GB
        download surviving a walk out of Wi-Fi range and not. Auth is the
        per-device token via the bearer header OR a `token` query param, matching
        the stream endpoint. Returns 409 while the job is still packaging.
      security: []
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: query, description: "Per-device token (alternative to the bearer header).", schema: { type: string } }
      responses:
        "200":
          description: The packaged MP4
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Partial content (range request)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job is not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-device token issued by registerDevice.
    provisionToken:
      type: apiKey
      in: header
      name: X-Provision-Token
      description: >-
        Static service-level provisioning secret (ARGOSY_PROVISION_TOKEN) for
        machine-to-machine account creation (Purser, ARGY-132).

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TranscodeStartRequest:
      type: object
      properties:
        startAt:
          type: number
          format: double
          description: Seek offset in seconds (default 0).
        hevc:
          type: boolean
          description: >
            Whether the client can play HEVC (H.265) in fMP4/MSE — detected via
            MediaSource.isTypeSupported. When true, an HEVC source is remuxed
            (copied) at native resolution including 4K instead of being
            re-encoded to H.264 1080p, and re-encodes of >1080p sources target
            HEVC. Defaults to false (H.264 only).
        hevcHardware:
          type: boolean
          description: >
            MediaCapabilities.decodingInfo's view of whether this client decodes
            10-bit HEVC (Main 10) in hardware — both `smooth` and
            `powerEfficient`. Read it asymmetrically: false is meaningful (the
            device has recorded decode stats and they are bad), while true is
            weak, because browsers report any supported configuration as smooth
            and powerEfficient until stats have been recorded on the device. The
            server treats it as a veto rather than a licence: a true only permits
            a 10-bit HEVC source to keep its bit depth and HDR above 1080p, where
            such a copy has been observed playing smoothly (ARGY-178). Absent or
            false re-encodes to 8-bit, which is the pre-ARGY-178 behaviour.
        burnInSubtitle:
          type: string
          description: >
            Id of an image-based subtitle track (a SubtitleTrack with burnIn
            true, e.g. "burn:6") to draw into the video frames. Image subtitles
            are bitmaps, so there is no WebVTT to hand a <track> element and the
            only way to show them is to paint them into the picture during the
            encode (ARGY-59). Doing so forces a full re-encode — the video stream
            can no longer be copied — and the result cannot be switched off
            without restarting the session, so send it only when the viewer picks
            such a track explicitly. Unset (the default) burns in nothing. An id
            that isn't an image subtitle stream of this item is a 400.

    TranscodeProgress:
      type: object
      required: [outTimeMs, speed, fps]
      properties:
        outTimeMs:
          type: integer
          format: int64
          description: Encoded timeline position in milliseconds.
        speed:
          type: number
          format: double
          description: Encode speed as a multiple of realtime (2.5 == 2.5x).
        fps:
          type: number
          format: double

    TranscodeSession:
      type: object
      required: [id, itemId, encoder, method, state, startAt, startedAt, playlistUrl, progress]
      properties:
        id:
          type: string
        itemId:
          type: string
          format: uuid
        encoder:
          type: string
        method:
          type: string
          enum: [remux, transcode]
          description: Whether this session copies codecs (remux) or re-encodes (transcode).
        state:
          type: string
          enum: [starting, running, complete, failed, stopped]
        startAt:
          type: number
          format: double
        startedAt:
          type: string
          format: date-time
        playlistUrl:
          type: string
          description: Relative URL of the HLS media playlist for this session.
        error:
          type: string
        progress:
          $ref: "#/components/schemas/TranscodeProgress"

    StowRequest:
      type: object
      description: >
        What the requesting device can play back offline. Both default to false,
        which is the conservative reading — an unknown client gets a packaged
        MP4, never a file it might not be able to open with no network to fall
        back on.
      properties:
        hevc:
          type: boolean
          description: >
            Whether the client hardware-decodes HEVC (H.265). True lets an HEVC
            source be handed over untouched instead of re-encoded to H.264,
            which for a big library is the difference between an instant stow and
            a long encode.
        matroska:
          type: boolean
          description: >
            Whether the client's player handles the Matroska (.mkv) container.
            True on Android (ExoPlayer), false on iOS (AVPlayer), which is why
            this is asked rather than assumed — most of a typical library is mkv,
            and the answer decides whether that library packages or passes
            through.

    StowJob:
      type: object
      required: [itemId, method, state]
      description: >
        How an item will reach the device for offline viewing. `method:
        passthrough` is a plan, not a job — it carries no `id` and no server-side
        state, because nothing is being made.
      properties:
        id:
          type: string
          format: uuid
          description: Job id, for polling and deletion. Absent for passthrough.
        itemId:
          type: string
          format: uuid
        method:
          type: string
          enum: [passthrough, package]
          description: >
            Whether the original file is handed over as-is (passthrough) or
            re-encoded into a single MP4 (package).
        state:
          type: string
          enum: [pending, packaging, ready, failed]
          description: >
            Passthrough is always `ready`. A package is `pending` while queued
            behind the encode concurrency limit, then `packaging`, then `ready`
            or `failed`.
        downloadUrl:
          type: string
          description: >
            Relative URL to download the file from. Present once state is
            `ready`; the stream endpoint for a passthrough, the job's file
            endpoint for a package.
        bytes:
          type: integer
          format: int64
          description: >
            Size of the download in bytes — the source file for a passthrough,
            the packaged MP4 for a package (known only once ready).
        durationSeconds:
          type: number
          format: double
          description: Source duration, so a client can render packaging progress as a percentage.
        progressSeconds:
          type: number
          format: double
          description: How far the encode has reached along the source timeline.
        reason:
          type: string
          description: Human-readable explanation of why this method was chosen, for the UI and the logs.
        error:
          type: string
          description: Failure detail when state is `failed`.
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time

    TranscodeCacheStats:
      type: object
      required: [totalBytes, budgetBytes, sessionDirs, liveDirs]
      properties:
        totalBytes: { type: integer, format: int64 }
        budgetBytes: { type: integer, format: int64 }
        sessionDirs: { type: integer }
        liveDirs: { type: integer }

    SubtitleTrack:
      type: object
      required: [id, source, language, label, forced, default]
      properties:
        id:
          type: string
          description: Track handle for the WebVTT endpoint (e.g. "embedded:3", "os:12345").
        source:
          type: string
          enum: [embedded, opensubtitles]
        language:
          type: string
          description: BCP-47 language code (e.g. "en"), or "und" when unknown.
        label:
          type: string
          description: Human-readable label for the subtitle picker.
        forced:
          type: boolean
        default:
          type: boolean
        burnIn:
          type: boolean
          description: >
            This track is image-based (PGS/VOBSUB/DVB) rather than text, so it
            has no WebVTT form: the subtitles endpoint will refuse its id. It can
            only be shown by burning it into the video during a transcode —
            POST /items/{itemId}/transcode with burnInSubtitle set to this id
            (ARGY-59). That costs a full re-encode and cannot be toggled off
            mid-session, so a client should present it as a distinct, deliberate
            choice rather than mixing it in with the text tracks. Absent or false
            means an ordinary text track.

    TranscodeCapabilities:
      type: object
      required: [available, selected]
      properties:
        available:
          type: array
          items:
            type: string
          description: Encoder backends usable on this host (always includes "software").
        selected:
          type: string
          description: The encoder chosen by the configured preference order.

    # The /healthz body — the SWY-192 build-identity contract that Switchyard's
    # delivery reconciler reads to record what is actually running (ARGY-213).
    #
    # `status` is "ok" on the 200 and "degraded" on the 503; the other two are
    # present and identical on both, which is the point of the contract. A
    # service whose database has just gone away is exactly the one whose build
    # you want named.
    HealthResponse:
      type: object
      required: [status, version, sha]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        version:
          description: >-
            Bare semver, or the literal "dev" for a build no release cut. Never
            carries a "v" prefix: it is compared with strict equality against
            the image's org.opencontainers.image.version label, which is
            stamped bare, and a prefix would never match.
          type: string
          example: 0.25.1
        sha:
          description: >-
            The full 40-character commit, or null when the build supplied none.
            Never abbreviated — the cross-service comparison is an equality
            test, not a prefix match.
          type: string
          nullable: true
          example: 5611a6c78a11e5f04a1c087c8cb9c2c138a3e8d5

    PingResponse:
      type: object
      required: [service, status, version]
      properties:
        service:
          type: string
          example: argosy
        status:
          type: string
          example: ok
        version:
          type: string
          example: dev

    Role:
      type: string
      enum: [admin, viewer]

    Account:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    UserProfile:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: The account email (ARGY-159). Matched case-insensitively.
        username:
          type: string
          deprecated: true
          description: >-
            Legacy alias for `email`, honored so pre-ARGY-159 clients can still
            sign in. Ignored when `email` is present.
        password:
          type: string
          format: password

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    AccountCreateRequest:
      type: object
      required: [email, accountName]
      properties:
        email:
          type: string
          description: Login email for the new account. Stored lowercased; must be unique.
        accountName:
          type: string
          description: Display name for the account and its initial admin profile.
        password:
          type: string
          format: password
          minLength: 8
          description: >-
            Optional initial password. When omitted the server generates one
            and returns it once as `generatedPassword`.

    AccountCreateResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        generatedPassword:
          type: string
          description: >-
            Present only when the request omitted `password`. Delivered exactly
            once — Argosy stores only the bcrypt hash.

    AccountLookupResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/Account"

    AccountConflictError:
      type: object
      description: >-
        The createAccount conflict body — the standard error message plus the
        existing account that owns the email (ARGY-163).
      required: [error, account]
      properties:
        error:
          type: string
        account:
          $ref: "#/components/schemas/Account"

    AccountSummary:
      type: object
      description: One row of the owner's account-management list (ARGY-86).
      required: [id, email, name, isOwner, disabled, profileCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        isOwner:
          type: boolean
          description: Whether this account owns the instance (ARGY-167).
        disabled:
          type: boolean
          description: Disabled accounts can't sign in and their devices stop authenticating.
        profileCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AccountUpdateRequest:
      type: object
      required: [disabled]
      properties:
        disabled:
          type: boolean

    PasswordResetResponse:
      type: object
      required: [generatedPassword]
      properties:
        generatedPassword:
          type: string
          description: >-
            The fresh password, delivered exactly once — only the bcrypt hash
            is stored, so it is never retrievable again.

    LoginResponse:
      type: object
      required: [account, profiles]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"

    DeviceRegistrationRequest:
      type: object
      required: [email, password, deviceName]
      properties:
        email:
          type: string
          description: The account email (ARGY-159). Matched case-insensitively.
        username:
          type: string
          deprecated: true
          description: >-
            Legacy alias for `email`, honored so pre-ARGY-159 clients can still
            pair. Ignored when `email` is present.
        password:
          type: string
          format: password
        userId:
          type: string
          format: uuid
          description: >-
            The profile this device is bound to. Required unless the account has
            no profiles yet, in which case pass `newProfileName` instead.
        newProfileName:
          type: string
          description: >-
            First-login bootstrap (ARGY-159): create this profile (viewer role)
            and bind the device to it. Only honored while the account has zero
            profiles; mutually exclusive with `userId`.
        deviceName:
          type: string
        platform:
          type: string
          description: Client platform/type label (e.g. "web", "tv", "phone"); shown in the Fleet.
        installId:
          type: string
          description: >-
            Stable per-install identifier the client persists across re-pairs.
            When present, a re-pair from the same physical device updates its
            existing Fleet row instead of creating a duplicate (ARGY-99). Omit to
            get a fresh device row each time.

    Device:
      type: object
      required: [id, name, userId, revoked, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
          nullable: true
          description: Client platform/type label captured at registration.
        userId:
          type: string
          format: uuid
          nullable: true
        userName:
          type: string
          nullable: true
          description: Display name of the profile this device is bound to (the Fleet shows whose device it is).
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DeviceRenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    DeviceSwitchRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: The profile (in the same account) to bind this device to.
        password:
          type: string
          format: password
          description: >-
            Account password. Required only when switching INTO an admin profile;
            ignored for viewer targets.

    ProfileSummary:
      type: object
      required: [id, name, role, deviceCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        deviceCount:
          type: integer
          description: Number of active (non-revoked) devices currently bound to this profile.

    ProfileCreateRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    ProfileUpdateRequest:
      type: object
      description: Fields to change; omit a field to leave it unchanged.
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    UserPreferences:
      type: object
      required: [homeLayout]
      properties:
        homeLayout:
          type: string
          enum: [focused, discovery]
          description: "Home density — focused trims to personal rows; discovery shows everything."

    DevicePreferences:
      type: object
      required: [subtitleEnabled]
      properties:
        subtitleLanguage:
          type: string
          nullable: true
          description: Preferred subtitle language (ISO code); the player auto-selects a matching track.
        subtitleEnabled:
          type: boolean
          description: Whether subtitles are on by default.
        audioLanguage:
          type: string
          nullable: true
          description: Preferred audio language (ISO code). Persisted; applied once audio-track selection ships.
        captionScale:
          type: number
          nullable: true
          description: Caption font scale (1.0 = default).
        captionColor:
          type: string
          nullable: true
          description: Caption text color (hex).
        captionBackground:
          type: string
          nullable: true
          enum: [translucent, solid, none]
          description: Caption background box style.
        captionPosition:
          type: string
          nullable: true
          enum: [bottom, raised, higher]
          description: >-
            Vertical caption placement: bottom (near the edge), raised (default,
            lifted above the control bar), or higher (further up the frame).
        seriesAutoAdvance:
          type: boolean
          nullable: true
          description: >-
            Whether finishing a series episode auto-plays the next one. Defaults
            to true (on) when unset.

    DeviceRegistrationResponse:
      type: object
      required: [device, token]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        token:
          type: string
          description: Bearer token for this device.

    LinkStartRequest:
      type: object
      properties:
        deviceName:
          type: string
          description: >-
            The new device's suggested Fleet name (e.g. "Pixel 9"). The approver
            may override it.
        platform:
          type: string
          description: >-
            The new device's platform (android, ios, androidtv, web). Defaults
            to androidtv for older clients that send no body.

    LinkStartResponse:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: Short, unambiguous pairing code the new device displays.
        expiresAt:
          type: string
          format: date-time

    LinkStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved]
        token:
          type: string
          nullable: true
          description: >-
            The device bearer token, present once the code is approved. Returned
            exactly once — the code is consumed on the poll that returns it.
        deviceName:
          type: string
          nullable: true
          description: The name the new device announced at start, if any.
        platform:
          type: string
          nullable: true
          description: The platform the new device announced at start, if any.

    LinkApproveRequest:
      type: object
      properties:
        deviceName:
          type: string
          description: >-
            Friendly name for the device in the Fleet. Overrides the name the
            device announced at start; falls back to "Living Room TV" when
            neither side names it.

    Session:
      type: object
      required: [accountId, userId, deviceId, role]
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        isOwner:
          type: boolean
          description: >
            True when this session's account owns the instance (ARGY-167). The
            owner's libraries are the server's catalog; only the owner may
            register or delete library roots and trigger scans. `role` is
            unrelated — it is the admin/viewer role *within* a household.
            Optional so a newer client can still parse an older server's
            response; treat absent as false.

    ScanLibraryResult:
      type: object
      required: [libraryId, name, scanned, errors]
      properties:
        libraryId: { type: string, format: uuid }
        name: { type: string }
        scanned: { type: integer }
        errors: { type: integer }
        error: { type: string }
      additionalProperties: false

    ScanStatus:
      type: object
      required: [running, libraries]
      properties:
        running: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        libraries: { type: array, items: { $ref: "#/components/schemas/ScanLibraryResult" } }
        tmdb:
          allOf: [{ $ref: "#/components/schemas/ScanTMDBStats" }]
          description: >-
            Metadata-provider traffic for the current or last sweep. Absent when
            no provider is configured, or the provider tracks no stats.

    ScanTMDBStats:
      type: object
      required:
        [
          requests,
          retries,
          throttled,
          exhausted,
          artworkRequests,
          artworkRetries,
          artworkThrottled,
          artworkExhausted,
          rateLimit,
          configuredRate,
        ]
      description: >-
        TMDB request accounting for one scan sweep. Counters are deltas for the
        sweep and climb live while it runs; rates are current levels.

        The unprefixed counters cover the metadata API (api.themoviedb.org); the
        artwork* ones cover the image CDN (image.tmdb.org). They are reported
        separately because they are different services with different rate
        policies, and artwork is the majority of a match run's requests — a
        poster and a backdrop per title, plus a still per episode.
      properties:
        requests:
          type: integer
          format: int64
          description: API round-trips sent this sweep, retries included.
        retries:
          type: integer
          format: int64
          description: API round-trips retried after a 429, 5xx, or transport error.
        throttled:
          type: integer
          format: int64
          description: >-
            429 responses from the API — it asking for a slower rate. Not a
            subset of retries: a request's final attempt is counted here but was
            never retried, so this can exceed retries.
        exhausted:
          type: integer
          format: int64
          description: >-
            API requests that used every retry and failed permanently. Each one
            is a title that went without metadata; non-zero warrants a re-match.
        artworkRequests:
          type: integer
          format: int64
          description: Image-CDN round-trips sent this sweep, retries included.
        artworkRetries:
          type: integer
          format: int64
          description: Image-CDN round-trips retried after a 429, 5xx, or transport error.
        artworkThrottled:
          type: integer
          format: int64
          description: >-
            429 responses from the image CDN. Reported but deliberately not acted
            on — the CDN does not steer the shared rate limit, which the API owns.
        artworkExhausted:
          type: integer
          format: int64
          description: >-
            Artwork downloads that failed permanently. These are missing posters,
            backdrops or episode stills — the title itself still has its metadata.
        rateLimit:
          type: number
          format: double
          description: >-
            The limiter's current ceiling in req/s, shared by both surfaces but
            steered only by the API. Below configuredRate means adaptive
            throttling has backed off after sustained 429s from the API; it
            recovers on its own as clean responses come back.
        configuredRate:
          type: number
          format: double
          description: The operator-configured ceiling in req/s (ARGOSY_TMDB_RATE).

    PlaybackInfo:
      type: object
      required: [directPlay, method, container]
      properties:
        directPlay: { type: boolean }
        method:
          type: string
          enum: [direct, remux, transcode]
          description: Cheapest playable path — serve as-is, repackage (copy codecs), or re-encode.
        container: { type: string }
        videoCodec: { type: string, nullable: true }
        audioCodec: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        preferredLanguages:
          type: array
          items: { type: string }
          description: >-
            Household preferred audio/subtitle languages (normalized ISO-639-1,
            e.g. ["en","ja"]). Pickers show matching tracks by default and fold
            the rest behind a "More options" expander (ARGY-154).

    PlayState:
      type: object
      required: [positionSeconds, watched]
      properties:
        positionSeconds: { type: number }
        durationSeconds: { type: number, nullable: true }
        watched: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }

    ProgressUpdate:
      type: object
      required: [positionSeconds]
      properties:
        positionSeconds: { type: number }
        durationSeconds: { type: number, nullable: true }

    WatchedUpdate:
      type: object
      required: [watched]
      properties:
        watched: { type: boolean }

    WatchedBulkResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, description: "Backing files whose watched state was written." }

    PlaybackSession:
      type: object
      required: [userId, deviceId, itemId, positionSeconds, state, startedAt, lastSeen]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        positionSeconds: { type: number, format: double }
        durationSeconds: { type: number, format: double, nullable: true }
        state: { type: string, description: "e.g. \"playing\"" }
        startedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        encoder: { type: string, nullable: true, description: "Encoder of the owned transcode session, if any." }
        method: { type: string, nullable: true, description: "remux | transcode, if this session owns a transcode session." }

    ContinueItem:
      type: object
      required: [id, kind, title, positionSeconds, percent]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true, description: "Landscape backdrop for full-screen heroes; falls back to posterUrl." }
        positionSeconds: { type: number }
        durationSeconds: { type: number, nullable: true }
        percent: { type: number }
        seriesId: { type: string, format: uuid, nullable: true }
        seriesTitle: { type: string, nullable: true }
        seasonNumber:
          type: integer
          nullable: true
          description: >
            Season number when this item is an episode; null for films. Named to
            match OnDeckItem so clients can share the "S1 · E1" formatting.
        episodeNumber:
          type: integer
          nullable: true
          description: Episode number when this item is an episode; null for films.
        episodeTitle:
          type: string
          nullable: true
          description: >
            The episode's own title (e.g. "The World of Swords"). Distinct from
            `title`, which is the media item's — filename-derived for episodes,
            and therefore usually a repeat of the series name plus release tags
            (ARGY-176). Null for films, which carry their name in `title`.
        lastPlayedDevice:
          allOf: [{ $ref: "#/components/schemas/DeviceRef" }]
          nullable: true
          description: "The deck that last owned this playhead, set only when it differs from the requesting device — drives the cross-device \"⇄ left off on\" pill (ARGY-98)."

    DeviceRef:
      type: object
      description: "Slim device reference (id + display name + platform) for cross-device UI like the resume pill."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string, nullable: true, description: "web | phone | tv | ..." }

    OnDeckItem:
      type: object
      required: [id, seriesId, seriesTitle, seasonNumber, episodeNumber]
      properties:
        id: { type: string, format: uuid, description: "The episode's playable media-item id." }
        seriesId: { type: string, format: uuid }
        seriesTitle: { type: string }
        seasonNumber: { type: integer }
        episodeNumber: { type: integer }
        title: { type: string, nullable: true, description: "Episode title." }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true, description: "Landscape backdrop; falls back to posterUrl." }
        durationSeconds: { type: number, nullable: true }

    Vault:
      type: object
      required: [id, name, shared, ownerId, ownerName, itemCount, isOwner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        shared: { type: boolean, description: "Visible to and curatable by the whole household." }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        itemCount: { type: integer }
        isOwner: { type: boolean, description: "Whether the calling profile owns this vault." }

    VaultEntry:
      type: object
      required: [entryId, kind, id, title]
      properties:
        entryId: { type: string, format: uuid, description: "The vault membership id (for remove/reorder)." }
        kind: { type: string, enum: [movie, series] }
        id: { type: string, format: uuid, description: "The film or series id (for routing)." }
        title: { type: string }
        year: { type: integer, nullable: true }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true }
        rating: { type: number, nullable: true }
        genres: { type: array, items: { type: string }, description: "Effective genres, for card captions. Omitted when none." }

    VaultDetail:
      type: object
      required: [id, name, shared, ownerId, ownerName, itemCount, isOwner, canEdit, items]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        shared: { type: boolean }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
        itemCount: { type: integer }
        isOwner: { type: boolean }
        canEdit: { type: boolean, description: "Whether the calling profile may add/remove/reorder items." }
        items: { type: array, items: { $ref: "#/components/schemas/VaultEntry" } }

    CreateVaultRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        shared: { type: boolean, default: false }

    UpdateVaultRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        shared: { type: boolean }

    AddVaultItemRequest:
      type: object
      description: "Exactly one of movieId or seriesId."
      properties:
        movieId: { type: string, format: uuid, nullable: true }
        seriesId: { type: string, format: uuid, nullable: true }

    ReorderVaultRequest:
      type: object
      required: [entryIds]
      properties:
        entryIds: { type: array, items: { type: string, format: uuid }, description: "Entry ids in the desired order." }

    Library:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        rootPath: { type: string, nullable: true, description: "Server-side media root (admin only)." }

    CreateLibraryRequest:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string, description: "Absolute path on the server; must be an existing directory." }
        kind: { type: string, enum: [movie, show, mixed], default: mixed }

    MediaItemSummary:
      type: object
      required: [id, kind, title]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true, description: "Landscape backdrop for full-screen heroes; falls back to posterUrl." }
        rating: { type: number, nullable: true, description: "Effective provider rating, 0–10." }
        genres: { type: array, items: { type: string }, description: "Effective genres, for card captions. Omitted when none." }

    MediaItemDetail:
      type: object
      required: [id, kind, title, filePath, reviewRequired]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        year: { type: integer, nullable: true }
        overview: { type: string, nullable: true }
        genres: { type: array, items: { type: string } }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true, description: "Landscape backdrop for full-screen heroes; falls back to posterUrl." }
        durationSeconds: { type: number, nullable: true }
        container: { type: string, nullable: true }
        filePath: { type: string }
        reviewRequired: { type: boolean }
        rating: { type: number, nullable: true, description: "Effective provider rating, 0–10." }
        cast: { type: array, items: { type: string }, description: "Top-billed cast names (plus the director, for films) from the metadata provider. Omitted when none." }
        seriesTitle: { type: string, nullable: true, description: "Parent series title, set only when this media item backs one or more episodes. Drives the player's now-playing header (ARGY-134)." }
        seasonNumber: { type: integer, nullable: true, description: "Season number of the episode this item backs, when applicable." }
        episodeNumber: { type: integer, nullable: true, description: "Episode number this item backs; for a combined rip it's the first episode of the span." }
        episodeTitle: { type: string, nullable: true, description: "Per-episode title (TMDB), when resolved. May still be the SxxExx filename fallback — clients should sanitize before display." }

    MediaItemPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MediaItemSummary" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    SeriesSummary:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        year: { type: integer, nullable: true }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true, description: "Landscape backdrop for full-screen heroes; falls back to posterUrl." }
        rating: { type: number, nullable: true, description: "Effective provider rating, 0–10." }
        genres: { type: array, items: { type: string }, description: "Effective genres, for card captions. Omitted when none." }

    SeriesPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SeriesSummary" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    SearchResults:
      type: object
      required: [movies, series]
      properties:
        movies: { type: array, items: { $ref: "#/components/schemas/MediaItemSummary" } }
        series: { type: array, items: { $ref: "#/components/schemas/SeriesSummary" } }

    Facet:
      type: object
      required: [type, value, count]
      properties:
        type: { type: string, enum: [genre], description: "Which dimension the value belongs to." }
        value: { type: string }
        count: { type: integer, description: "Number of films + series carrying it." }

    EpisodeSummary:
      type: object
      required: [id, episodeNumber]
      properties:
        id: { type: string, format: uuid }
        episodeNumber: { type: integer }
        title: { type: string, nullable: true }
        overview: { type: string, nullable: true, description: "Per-episode synopsis from the metadata provider." }
        stillUrl: { type: string, nullable: true, description: "Episode still (16:9 landscape) image URL, or null when none." }
        mediaItemId: { type: string, format: uuid, nullable: true, description: "Backing file. Several episodes sharing one mediaItemId are a single combined rip." }
        durationSeconds: { type: number, nullable: true }
        positionSeconds: { type: number, nullable: true, description: "Current profile's resume position." }
        watched: { type: boolean, nullable: true }
        rating: { type: number, nullable: true, description: "Effective per-episode provider rating (vote_average), 0–10. Null when the provider has none." }

    SeasonSummary:
      type: object
      required: [id, seasonNumber, episodes]
      properties:
        id: { type: string, format: uuid }
        seasonNumber: { type: integer }
        title: { type: string, nullable: true }
        episodes: { type: array, items: { $ref: "#/components/schemas/EpisodeSummary" } }

    SeriesDetail:
      type: object
      required: [id, title, seasons]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        year: { type: integer, nullable: true }
        overview: { type: string, nullable: true }
        posterUrl: { type: string, nullable: true }
        backdropUrl: { type: string, nullable: true, description: "Landscape backdrop for full-screen heroes; falls back to posterUrl." }
        seasons: { type: array, items: { $ref: "#/components/schemas/SeasonSummary" } }
        cast: { type: array, items: { type: string }, description: "Top-billed cast names from the metadata provider. Omitted when none." }

security:
  - bearerAuth: []
