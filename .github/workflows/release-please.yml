name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # For a root component (path `.`) v4 exposes UN-prefixed outputs
      # (`releases_created`, `tag_name`); the `<path>--` prefix is only for
      # non-root monorepo paths. Using `.--tag_name` here returned empty, so the
      # mobile build fell back to github.ref_name (`main`) and failed at upload.
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please cuts the v* tag with GITHUB_TOKEN, which can't fire a
  # downstream `on: push: tags` run — so trigger the signed mobile build here,
  # in the same (real-user push-to-main) run, once a release was actually cut.
  mobile-release:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/mobile-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Same reason as mobile-release above, for the GHCR image (SERV-125). publish.yml
  # runs on every push to main for :latest and sha-<short>, but its semver tags need
  # a release, and the `on: push: tags` trigger that was supposed to supply one had
  # never fired in the repo's history — GITHUB_TOKEN-authored tags create no events.
  # So no versioned image had ever been published, and construct-server had to pin
  # this service by sha instead of by major.minor.
  publish:
    needs: release-please
    # `!= 'false'` rather than `== 'true'`, deliberately. release-please answers
    # exactly one of those two on a healthy run, so the third case — an output
    # that reads back EMPTY because it was renamed or wrongly prefixed — is a
    # real possibility, and under `== 'true'` it skips this job on every push
    # without a word. That is the same silent-skip shape as the bug being fixed.
    # This way a broken output runs the job and fails it loudly instead.
    if: needs.release-please.outputs.releases_created != 'false'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      from_release: true
    permissions:
      contents: read
      packages: write
