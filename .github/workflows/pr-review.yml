name: PR Review

# Fresh-context review of every pull request (SERV-59), via the shared definition
# in construct-server (SERV-92). This was 463 lines of hand-copied workflow, and
# it had not received any of SERV-87's fixes — it was still running
# `--max-turns 40`, still reporting a triage skip as a green check, and still
# failing complete reviews that overshot the cap.
#
# `.github/review-prompt.md` is deleted, not moved: the shared workflow fetches
# the procedure from construct-server (`prompt_repo`/`prompt_ref`, defaulting to
# `@main`), so a local copy could only ever drift out of use. It is NOT fetched
# at the workflow's own commit — `job_workflow_sha` would have given that and is
# empty on this Actions version, which is what 404'd the fetch on #211 — so
# pinning `uses: ...@<tag>` means pinning `prompt_ref` to match.
#
# Judgement stays here in `REVIEW.md` and `CLAUDE.md`; generated artifacts in
# `.github/review-ignore`. See construct-server's `docs/pr-reviewer.md`.

on:
  # `reopened` is here because `opened` is not guaranteed to have fired: a PR
  # that conflicts with its base produces no `pull_request` runs at all, so a PR
  # born conflicting — as #194 was, against `graphify-out/` (ARGY-185) — never
  # got its unconditional review, and every later `synchronize` was skipped for
  # lacking `review:always`. Green checks, nothing read. The real fix is the
  # shared workflow's, in construct-server#141 (SERV-126): triage reviews any PR
  # that no review has ever been posted on, whatever the action. This is the
  # cheap second door, for the close/reopen path.
  #
  # Deliberately NOT `pull_request_target`, which would sidestep the conflict
  # dependency entirely: it runs against the base ref and carries a worse
  # security posture on a self-hosted runner.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# A called workflow cannot be granted more than its caller holds.
permissions:
  contents: read
  pull-requests: write
  issues: read

# No `concurrency:` — the shared workflow owns it.

jobs:
  pr-review:
    uses: Einlanzerous/construct-server/.github/workflows/pr-review-reusable.yml@main
    with:
      # Paths where a mistake widens access, loses data, leaks a secret, or
      # compromises the runner. Carried over from the local copy, plus
      # `.github/review-ignore` — the reviewer's own scope, where a widened
      # pattern silently shrinks what gets read.
      #
      # `proto/` is deliberately here and deliberately NOT in review-ignore:
      # `proto/openapi/argosy.yaml` is the hand-authored spec that all three
      # generated clients come from, so it is the file worth reading when a
      # route changes — the generated output is what gets excluded.
      sensitive_paths: '^(internal/auth/|internal/db/migrations/|proto/|deploy/|\.github/workflows/|REVIEW\.md|CLAUDE\.md|\.github/review-prompt\.md|\.github/review-ignore)'

      # No `docs_skip_extra: '^graphify-out/|'`, which the local copy carried:
      # `.github/review-ignore` now excludes `^graphify-out/` outright. The old
      # value classified 473 committed cache files as documentation; they are
      # generated, which is a different thing and a different mechanism.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      switchyard_token: ${{ secrets.SWITCHYARD_REVIEWER_TOKEN }}
